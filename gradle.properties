# Gradle
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# --- App identity (single source of truth for every module) ---
dorehami.applicationId=ir.dorehami.app
dorehami.minSdk=24
# compileSdk 37: the 2026.09 androidx/Compose stack declares minCompileSdk 37 in its AAR metadata.
dorehami.compileSdk=37
dorehami.targetSdk=36
dorehami.versionCode=1
dorehami.versionName=0.1.0

# --- Server defaults (overridden by environment variables in production) ---
dorehami.server.baseUrl=http://10.0.2.2:8080
