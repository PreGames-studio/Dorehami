# Validate native libraries and their template on emulators without building a game APK.
name: Dezhban 16 KiB native loader diagnostics

on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/dejban-16kb-loader-diagnostics.yml"
      - "games/dejban/tools/android_16kb_load_probe.c"
      - "games/dejban/tools/test_android_16kb_loader.sh"
      - "games/dejban/tools/replace_android_template_libraries.py"
      - "games/dejban/tools/verify_apk_16kb.py"
      - "games/dejban/tools/verify_elf_16kb.py"
      - "games/dejban/tools/tests/test_android_16kb.py"

permissions:
  actions: read
  contents: read

jobs:
  load-native:
    name: Validate native libraries (${{ matrix.label }})
    if: ${{ contains(github.event.head_commit.message, '[loader-check]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 16k-pages
            target: google_apis_ps16k
            page_size: 16384
          - label: 4k-pages
            target: google_apis
            page_size: 4096
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find a successful native-template diagnostic run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow dejban-16kb-template-diagnostics.yml --branch "$GITHUB_REF_NAME" \
            --limit 20 --json databaseId,conclusion \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          test -n "$run_id" && test "$run_id" != null
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.head_sha')
          for file in games/dejban/tools/build_godot43_android_16kb.sh games/dejban/tools/patch_godot43_android_ndk.py; do
            git diff --quiet "$source_sha" HEAD -- "$file" || {
              echo "The native builder changed since run $run_id; build fresh libraries first." >&2
              exit 1
            }
          done
          echo "Using libraries from run $run_id at $source_sha."
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download the previously rebuilt x86_64 libraries
        uses: actions/download-artifact@v4
        with:
          name: godot43-16kb-x86_64
          path: rebuilt/x86_64
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Download the previously rebuilt ARM64 libraries
        uses: actions/download-artifact@v4
        with:
          name: godot43-16kb-arm64
          path: rebuilt/arm64-v8a
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Test template and APK validation tools
        if: ${{ matrix.page_size == 16384 }}
        run: python3 -m unittest discover -s games/dejban/tools/tests -p 'test_android_16kb.py' -v
      - name: Prepare the old libraries and the standalone diagnostic executable
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o published.apk 'https://github.com/PreGames-studio/Dorehami/releases/download/apk-latest/dezhban.apk'
          echo 'a76b74e5d0388e0f42a6f558b6e63fd01ff07ecbc35795041fe59aee99c8cf5f  published.apk' | sha256sum -c -
          for abi in x86_64 arm64-v8a; do
            mkdir -p "old/$abi"
            unzip -joq published.apk "lib/$abi/libgodot_android.so" "lib/$abi/libc++_shared.so" -d "old/$abi"
          done
          if [[ ! -d "$ANDROID_HOME/ndk/28.1.13356709" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.1.13356709'
          fi
          bin="$ANDROID_HOME/ndk/28.1.13356709/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for spec in 'x86_64 x86_64-linux-android21' 'arm64-v8a aarch64-linux-android21'; do
            read -r abi triple <<< "$spec"
            "$bin/$triple-clang" -Wall -Wextra -Werror -Wl,-z,max-page-size=16384 \
              games/dejban/tools/android_16kb_load_probe.c -ldl -o "loader-probe-$abi"
            python3 games/dejban/tools/verify_elf_16kb.py --abi "$abi" "rebuilt/$abi/"*.so "loader-probe-$abi"
          done
      - name: Compare published and rebuilt Godot JNI exports
        run: |
          python3 - <<'PY'
          import subprocess
          def exports(path):
              output=subprocess.check_output(['readelf','--dyn-syms','--wide',path], text=True)
              symbols=set()
              for line in output.splitlines():
                  fields=line.split()
                  if len(fields) >= 8 and fields[4] in ('GLOBAL','WEAK') and fields[6] != 'UND':
                      symbol=fields[7].split('@')[0]
                      if symbol.startswith('Java_') or symbol == 'JNI_OnLoad':
                          symbols.add(symbol)
              return symbols
          for abi in ('x86_64','arm64-v8a'):
              old=exports(f'old/{abi}/libgodot_android.so')
              rebuilt=exports(f'rebuilt/{abi}/libgodot_android.so')
              missing=sorted(old-rebuilt)
              if not old or missing:
                  raise SystemExit(f'{abi}: missing JNI exports: {missing}; old count {len(old)}')
              print(f'{abi}: all {len(old)} published JNI exports are present in the rebuilt library.')
          PY
      - name: Validate replacement inside the official Godot template
        if: ${{ matrix.page_size == 16384 }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/templates.tpz" \
            'https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz'
          echo '476366caf0fd45a8f24136cf9cf1dc0bc2b96f7c82d53e5f82200b55aefd07b286d283fd6f1ce29e0de70648c5a51d3b12f96c6d4fafd4e8c4878ecda6406d6a  '"$RUNNER_TEMP/templates.tpz" | sha512sum -c -
          unzip -joq "$RUNNER_TEMP/templates.tpz" 'templates/android_debug.apk' -d "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/templates.tpz"
          python3 games/dejban/tools/replace_android_template_libraries.py \
            "$RUNNER_TEMP/android_debug.apk" rebuilt "$RUNNER_TEMP/android_debug-16k.apk"
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          python3 games/dejban/tools/verify_apk_16kb.py "$RUNNER_TEMP/android_debug-16k.apk" "$aapt"
          python3 - "$RUNNER_TEMP/android_debug.apk" "$RUNNER_TEMP/android_debug-16k.apk" <<'PY'
          from zipfile import ZipFile
          import sys
          replaced={f'lib/{abi}/{name}' for abi in ('arm64-v8a','x86_64') for name in ('libgodot_android.so','libc++_shared.so')}
          with ZipFile(sys.argv[1]) as original, ZipFile(sys.argv[2]) as updated:
              assert original.namelist() == updated.namelist()
              for info in original.infolist():
                  assert info.compress_type == updated.getinfo(info.filename).compress_type
                  if info.filename not in replaced:
                      assert original.read(info) == updated.read(info.filename), info.filename
          print('All other template entries and compression methods are unchanged.')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Load the published and rebuilt libraries
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -no-boot-anim -no-audio -camera-back none
            -gpu swiftshader_indirect
          script: >-
            bash -c 'bash games/dejban/tools/test_android_16kb_loader.sh loader-probe-x86_64 old/x86_64 rebuilt/x86_64 ${{ matrix.page_size }} x86_64 && bash games/dejban/tools/test_android_16kb_loader.sh loader-probe-arm64-v8a old/arm64-v8a rebuilt/arm64-v8a ${{ matrix.page_size }} arm64-v8a' > loader-check.log 2>&1
      - name: Surface the native loader result
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('loader-check.log')
          text=path.read_text(errors='replace') if path.exists() else 'The emulator loader test did not produce a log.'
          text=text[-12000:].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::notice title=dezhban-16kb-loader::{text}')
          PY
