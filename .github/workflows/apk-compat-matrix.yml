# Compatibility matrix — why would a real phone refuse the published APK?
#
# The build gate proves the file is complete, aligned and signed. A user still saw
# «برنامه نصب نشد چون به نظر می‌رسد بسته معتبر نیست» on a physical phone, which the
# PackageInstaller shows only after the APK parsed, i.e. an install-time refusal:
# signature verification, native-library extraction, ABI support or a stricter
# platform rule. This workflow installs the exact published file on several Android
# profiles and prints the INSTALL_FAILED_* reason for each one.
name: APK compatibility matrix
# Touching this file re-runs the matrix against the current preview APK.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "تگ ریلیزی که APK آن تست می‌شود"
        required: true
        default: "preview-arena-afc269b8-dorehami"
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/apk-compat-matrix.yml"]

permissions:
  contents: read

jobs:
  install:
    name: Install on ${{ matrix.label }}
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[compat]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 30
            target: google_apis
            label: "Android 11 (4 KiB)"
          - api: 34
            target: google_apis
            label: "Android 14 (4 KiB)"
          - api: 35
            target: google_apis_playstore
            label: "Android 15 Play (4 KiB)"
          - api: 35
            target: google_apis_ps16k
            label: "Android 15 (16 KiB pages)"
    steps:
      - uses: actions/checkout@v4

      - name: Download the published APK and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || 'preview-arena-afc269b8-dorehami' }}
        run: |
          set -euo pipefail
          mkdir -p apk
          for attempt in 1 2 3; do
            gh release download "$TAG" --pattern 'Dorehami-debug.apk' \
              --pattern 'Dorehami-debug.apk.sha256' --dir apk --clobber
            if (cd apk && sha256sum -c Dorehami-debug.apk.sha256); then break; fi
            sleep 20
            [ "$attempt" = 3 ] && { echo "::error::published APK does not match its .sha256"; exit 1; }
          done
          ls -l apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and explain
        continue-on-error: true
        id: install
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -no-boot-anim -no-audio -camera-back none
            -gpu swiftshader_indirect -memory 4096
          script: bash tools/apk-proof/install_and_explain.sh apk/Dorehami-debug.apk ir.dorehami.app compat.log

      - name: Surface the result as an annotation
        if: always()
        run: |
          {
            echo "## ${{ matrix.label }} — ${{ steps.install.outcome }}"
            echo '```'
            cat compat.log 2>/dev/null || echo "(the install script never ran)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s compat.log ]; then
            python3 - <<'PY'
          import os, pathlib
          text = pathlib.Path("compat.log").read_text(errors="replace")
          lines = text.splitlines()
          if len(lines) > 40:
              lines = lines[:12] + ["..."] + lines[-26:]
          safe = "\n".join(lines)[:5000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::notice title=apk-compat::{safe}")
          PY
          fi

      - name: Save the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-compat-${{ strategy.job-index }}
          path: compat.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail the job when the install was refused
        if: steps.install.outcome != 'success'
        run: |
          echo "::error::the published APK did not install on ${{ matrix.label }}"
          exit 1
