# Dejban (Godot) verify — the Dezhban project's own "Godot verify" workflow, moved to this monorepo.
#
# پروژهٔ Godot دژبان در games/dejban/godot نشسته است. GitHub فقط گردش‌کارهای پوشهٔ
# .github/workflows ریشه را اجرا می‌کند، پس گردش‌کارهای داخل games/dejban/godot/.github
# این‌جا غیرفعال‌اند و این فایل همان «Godot verify» را با دو تفاوت اجرا می‌کند:
#   • همهٔ دستورها داخل games/dejban/godot اجرا می‌شوند (working-directory)؛
#   • فقط وقتی اجرا می‌شود که خود پروژهٔ Godot یا همین فایل عوض شده باشد،
#     تا روی کار بازی‌های دیگر هیچ اثری نگذارد.
# خروجی ساخت (APK) این‌جا ساخته نمی‌شود.
name: Dejban (Godot) verify

on:
  push:
    branches: [main, "arena/**"]
    paths:
      - "games/dejban/godot/**"
      - ".github/workflows/dejban-godot-verify.yml"
  pull_request:
    paths:
      - "games/dejban/godot/**"
      - ".github/workflows/dejban-godot-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dejban-godot-verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3-stable"

defaults:
  run:
    working-directory: games/dejban/godot

jobs:
  verify:
    name: Import and headless self-test (games/dejban/godot)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install Godot
        run: |
          set -e
          mkdir -p "$HOME/.local/bin"
          curl -sSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d "$HOME/.local/bin"
          GODOT_BIN=$(find "$HOME/.local/bin" -maxdepth 1 -type f -name "Godot*" | head -n 1)
          chmod +x "$GODOT_BIN"
          mv "$GODOT_BIN" "$HOME/.local/bin/godot"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import assets
        run: godot --headless --path . --import 2>&1 | tail -40

      # کد خروج Godot با pipefail حفظ می‌شود تا تستِ ناموفق، اجرا را بشکند.
      - name: Run the headless self-test
        id: selftest
        timeout-minutes: 6
        run: |
          set -o pipefail
          # --quit-after سقف ایمنی است: اگر تست جایی منتظر بماند، موتور خودش
          # بیرون می‌آید و لاگ نیمه‌کاره برای عیب‌یابی می‌ماند.
          if godot --headless --path . --fixed-fps 60 --quit-after 3600 res://tests/headless_test.tscn 2>&1 | tee /tmp/dezhban-test.log; then
            echo "result=ok" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for script errors in the log
        if: always()
        run: |
          # الگوهای خطای واقعی زمان اجرا؛ خطاهای بی‌خطر پایان اجرا (مثل
          # «resources still in use at exit») عمداً بیرون مانده‌اند.
          PATTERN='SCRIPT ERROR|Parse Error|Failed to load script|Cannot open file|Nonexistent function|Invalid call|read-only state|Invalid get index|Invalid set index|Invalid access to property|Cannot call method|Cannot infer the type'
          if grep -nE "$PATTERN" /tmp/dezhban-test.log; then
            echo "::error title=dezhban-runtime-error::$(grep -cE "$PATTERN" /tmp/dezhban-test.log) خطای زمان اجرا در لاگ دیده شد"
            exit 1
          else
            echo "بدون خطای زمان اجرا"
          fi

      # خلاصهٔ تست به‌صورت annotation منتشر می‌شود تا از API هم خواندنی باشد.
      - name: Publish the test summary
        if: always()
        run: |
          MSG=$(tail -n 80 /tmp/dezhban-test.log | tr '\n' '¶' | sed 's/%/%25/g; s/\r//g')
          if [ "${{ steps.selftest.outputs.result }}" = "fail" ]; then
            echo "::error title=dezhban-self-test::$MSG"
            exit 1
          fi
          if grep -qE "SCRIPT ERROR|Parse Error|Nonexistent function|Invalid call|read-only state|Cannot call method" /tmp/dezhban-test.log; then
            echo "::error title=dezhban-script-error::$MSG"
            exit 1
          fi
          echo "::notice title=dezhban-self-test::$MSG"
