# Trial build — same app under a different package id.
#
# Xiaomi/HyperOS keeps refusing a reinstall when it still has a record of an older
# install signed with another key ("برنامه نصب نشد چون بسته معتبر نیست"). This build
# ships with `ir.dorehami.trial` so it cannot collide with any leftover record, and
# it carries both phone ABIs so a 32-bit device can install it too.
name: Trial APK (separate package id)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "روی ریلیز پیش‌نمایش همین شاخه منتشر شود"
        type: boolean
        default: true
  push:
    branches: ["arena/**"]
    paths: [".github/workflows/apk-trial.yml"]

permissions:
  contents: write   # only used by the preview-release upload step

jobs:
  build-trial:
    name: Build the trial APK
    concurrency:
      group: apk-preview-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare embedded Dezhban Godot pack
        run: bash games/dejban/tools/prepare_android_pack.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with a separate package id and both phone ABIs
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug \
            -Pdorehami.applicationId=ir.dorehami.trial \
            -Pdorehami.additionalAndroidAbis=armeabi-v7a \
            --stacktrace 2>&1 | tail -n 40

      - name: Verify the trial APK
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools=$(find "${sdk:-/nonexistent}/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l "$apk" | grep -q "lib/$abi/libgodot_android.so" || {
              echo "::error::lib/$abi/libgodot_android.so is missing from the trial APK"; exit 1; }
          done
          "$tools/aapt2" dump badging "$apk" | head -n 2
          python3 scripts/verify_shipped_apk.py "$apk" --expect-package ir.dorehami.trial --aapt "$tools/aapt2" | tee verify.txt
          "$tools/zipalign" -c -v 4 "$apk" > /dev/null
          for api in 24 26 28 30 33 34 35; do
            "$tools/apksigner" verify --min-sdk-version "$api" "$apk"
          done
          echo "APK_SHA256=$(awk '/^sha256:/{print $2; exit}' verify.txt)" >> "$GITHUB_ENV"
          echo "APK_BYTES=$(stat -c%s "$apk")" >> "$GITHUB_ENV"

      - name: Upload the trial APK
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-trial-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish on the branch preview release
        if: startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          tag="preview-${branch}"
          cp "$apk" "Dorehami-trial-debug.apk"
          printf '%s  Dorehami-trial-debug.apk\n' "${APK_SHA256}" > Dorehami-trial-debug.apk.sha256
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease --title "Preview: ${GITHUB_REF_NAME}" --target "${GITHUB_SHA}" --notes "بیلد پیش‌نمایش ${GITHUB_REF_NAME}"
          for attempt in 1 2 3; do
            if gh release upload "$tag" "Dorehami-trial-debug.apk" "Dorehami-trial-debug.apk.sha256" --clobber 2>&1; then
              echo "published trial APK: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/Dorehami-trial-debug.apk"
              exit 0
            fi
            sleep 15
          done
          echo "::error title=trial-upload::could not upload the trial APK"
          exit 1
