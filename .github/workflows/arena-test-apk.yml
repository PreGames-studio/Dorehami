# TEMPORARY — publishes one test APK of this branch as a GitHub pre-release so the owner can
# download it directly to a phone, and hands the same file to the Arena session as unreferenced
# git blobs (the sandbox cannot reach release downloads). Removed again right after use.
name: Arena test APK (temporary)

on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/arena-test-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish the test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: test-pantohub-round3
      # Shown in Android's app info, so the owner can tell this build from the earlier ones.
      VERSION_NAME: 0.1.0-pantohub-test3
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug -Pdorehami.versionName="$VERSION_NAME" --stacktrace

      - name: Check the version inside the APK
        run: |
          set -euo pipefail
          src=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          pkg=$("$bt/aapt2" dump badging "$src" | grep "^package:")
          echo "::notice title=apk-package::$pkg"
          echo "$pkg" | grep -q "versionName='$VERSION_NAME'"

      - name: Publish the pre-release
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          mkdir -p dist
          src=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$src" dist/Dorehami-debug.apk
          cp "$src" "dist/Dorehami-debug-pantohub-round3-${short}.apk"
          sum=$(sha256sum dist/Dorehami-debug.apk | cut -d' ' -f1)
          size=$(stat -c %s dist/Dorehami-debug.apk)
          cat > notes.md <<EOF
          نسخهٔ آزمایشی (debug) برای تست روی گوشی — شاخهٔ \`${GITHUB_REF_NAME}\` @ \`${short}\` — نسخهٔ برنامه \`${VERSION_NAME}\`.

          **تازه در این نسخه (مرحلهٔ ۳):**
          - «حدس درست» و «رد واژه» روی صفحهٔ واژهٔ پوشیده هم کار می‌کنند (وقتی اجراکننده واژه را دیده باشد):
            در حالت «عادی» حدس درست نوبت را تمام می‌کند، امتیاز ثبت می‌شود و نوبت تیم بعد می‌رسد.
          - صفحهٔ «نوبت بعدی» می‌گوید تیم قبلی در نوبتش چند امتیاز گرفت.
          - پیش از دیدن واژه، دکمه‌های غیرفعال بی‌مصرف دیگر نشان داده نمی‌شوند (PH-B05).

          **از مرحله‌های قبل:** پایان نوبت عادی با حدس درست روی صفحهٔ واژه (PH-B01)، روشن‌ماندن صفحه در نوبت
          (PH-B02)، توقف نوبت هنگام خروج از برنامه (PH-B04)، پاک‌شدن خطای نوبت قبل (PH-B06)، صدای «درست» فقط
          برای پاسخِ امتیازدار (PH-B07).

          نصب: اگر نسخهٔ قبلی نصب است، اول آن را حذف کن (امضای نسخه‌های آزمایشی فرق دارد). بعد فایل را روی گوشی
          باز کن (ممکن است اجازهٔ «نصب از منبع ناشناس» لازم باشد). نسخهٔ نصب‌شده در اطلاعات برنامه باید
          \`${VERSION_NAME}\` باشد.

          SHA-256: \`${sum}\` · اندازه: ${size} بایت
          EOF
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "نسخهٔ آزمایشی پانتومیم — مرحلهٔ ۳ (${short})" \
            --notes-file notes.md \
            dist/Dorehami-debug.apk "dist/Dorehami-debug-pantohub-round3-${short}.apk"
          echo "::notice title=test-apk::https://github.com/${GH_REPO}/releases/download/${TAG}/Dorehami-debug.apk sha256=${sum} size=${size}"

      - name: Hand the APK to the Arena session (unreferenced git blobs)
        run: |
          set -euo pipefail
          f=dist/Dorehami-debug.apk
          size=$(stat -c%s "$f")
          sum=$(sha256sum "$f" | cut -d' ' -f1)
          split -b 8000000 -d -a 2 "$f" part-
          parts=""
          for p in part-*; do
            python3 -c 'import base64, json, sys; d = open(sys.argv[1], "rb").read(); json.dump({"content": base64.b64encode(d).decode(), "encoding": "base64"}, open("body.json", "w"))' "$p"
            sha=$(gh api "repos/$GH_REPO/git/blobs" --input body.json --jq .sha)
            parts="$parts $p=$sha"
          done
          echo "::notice title=apk-handoff::size=$size sha256=$sum parts=$parts"
