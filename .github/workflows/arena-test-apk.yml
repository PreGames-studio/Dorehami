# TEMPORARY — publishes one test APK of this branch as a GitHub pre-release so the owner can
# download it directly to a phone. Removed again right after the release is verified.
name: Arena test APK (temporary)

on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/arena-test-apk.yml"

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish the test APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: test-pantohub-round2
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Publish the pre-release
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          mkdir -p dist
          src=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$src" dist/Dorehami-debug.apk
          cp "$src" "dist/Dorehami-debug-pantohub-round2-${short}.apk"
          sum=$(sha256sum dist/Dorehami-debug.apk | cut -d' ' -f1)
          size=$(stat -c %s dist/Dorehami-debug.apk)
          cat > notes.md <<EOF
          نسخهٔ آزمایشی (debug) برای تست روی گوشی — شاخهٔ \`${GITHUB_REF_NAME}\` @ \`${short}\`.

          **تازه در این نسخه (مرحلهٔ ۲):**
          - تا وقتی نوبت در حال اجراست، صفحهٔ گوشی خاموش نمی‌شود (PH-B02).
          - خروج از برنامه (دکمهٔ خانه، تماس، رفتن به برنامهٔ دیگر) نوبت را متوقف می‌کند و واژه را می‌پوشاند؛
            با «ادامهٔ نوبت» با همان زمانِ باقی‌مانده ادامه می‌دهد (PH-B04).

          **از مرحلهٔ ۱ (همچنان در این نسخه):** حالت «عادی» با حدس درست نوبت را تمام می‌کند (PH-B01)،
          خطای نوبت قبل روی صفحهٔ تیم بعد نمی‌ماند (PH-B06)، صدای «درست» فقط برای پاسخِ امتیازدار (PH-B07).

          نصب: فایل را روی گوشی باز کن (ممکن است اجازهٔ «نصب از منبع ناشناس» لازم باشد) یا
          \`adb install -r -t Dorehami-debug.apk\`.

          SHA-256: \`${sum}\` · اندازه: ${size} بایت
          EOF
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "نسخهٔ آزمایشی پانتومیم — مرحلهٔ ۲ (${short})" \
            --notes-file notes.md \
            dist/Dorehami-debug.apk "dist/Dorehami-debug-pantohub-round2-${short}.apk"
          echo "::notice title=test-apk::https://github.com/${GH_REPO}/releases/download/${TAG}/Dorehami-debug.apk sha256=${sum} size=${size}"
