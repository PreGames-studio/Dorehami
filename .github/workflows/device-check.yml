# Device check — runs chess, chess-store navigation, and Hokm on a real emulator.
#
# Plain JVM tests (checkAll) never touch GLSurfaceView, EGL config choices, SoundPool, bundled
# fonts, or Compose resource loading. This workflow installs the debug APK and walks through the
# chess bot path, the chess-owned store, and the Hokm setup/table while capturing screenshots.
name: Device check

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/device-check.yml"
      - "tools/device-check/**"
      - "games/chess/**"

permissions:
  contents: read

jobs:
  chess-on-device:
    name: Chess, store and Hokm on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build an emulator-compatible debug APK
        run: ./gradlew :app:assembleDebug -Pdorehami.additionalAndroidAbis=x86_64 --stacktrace

      - name: Verify the emulator native library
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" | grep 'lib/x86_64/libgodot_android.so' || {
            echo '::error::x86_64 Godot native library missing from emulator APK'
            exit 1
          }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and drive the app on the emulator
        id: device
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -no-boot-anim -no-audio -camera-back none
            -gpu swiftshader_indirect
          # No `pipefail`/pipes here: the runner executes this block with `sh`, where `set -o pipefail`
          # is not available (it aborts with exit code 2 before anything runs).
          script: |
            python3 tools/device-check/chess_start_crash.py app/build/outputs/apk/debug/app-debug.apk > device-log.txt 2>&1
            rc=$?
            cat device-log.txt
            echo "device-check exit code: $rc"
            exit $rc

      # The raw log is behind a blob URL that API-only reviewers cannot fetch, so the interesting
      # lines are re-emitted as annotations (readable via the check-run API) — same trick as ci.yml.
      - name: Surface the device log as annotations
        if: always()
        run: |
          echo "::notice::emulator step outcome: ${{ steps.device.outcome }}"
          python3 tools/device-check/report_annotations.py device-log.txt || true

      - name: Upload screenshots and device log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-screenshots
          path: |
            device-shots/*.png
            device-log.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.device.outcome }}" = "success" ]; then
            echo "## 📱 Chess, store and Hokm on a device ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "شطرنج، مسیر فروشگاه شطرنج و میز حکم روی امولاتور باز شدند و زنده ماندند (اسکرین‌شات‌ها در Artifacts)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 📱 Chess, store and Hokm on a device ❌" >> "$GITHUB_STEP_SUMMARY"
            echo "حداقل یک مسیر روی امولاتور شکست خورد — لاگ کامل در بخش Log همین اجرا (گام «Install and drive the app»)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
