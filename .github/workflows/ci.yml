# CI — builds the debug APK and publishes it as a downloadable artifact.
# `test` runs every JVM module's unit tests (the game rules live there, so this is the
# real safety net); `build-apk` proves the Android/Compose side still compiles.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: JVM tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # فقط ماژول‌های JVM (قواعدِ بازی‌ها این‌جا هستند). ماژول‌های اندرویدی را jobِ بعدی
      # از نظرِ کامپایل چک می‌کند؛ فعلاً تستِ واحد ندارند.
      - name: Run JVM tests
        run: |
          set -o pipefail
          ./gradlew :core:protocol:test :core:gamesdk:test :games:hokm:core:test \
            --stacktrace --continue 2>&1 | tee test.log

      # لاگِ کامل را همیشه نمی‌توان دانلود کرد؛ اسمِ تست‌های شکست‌خورده و پیامِ خطا را به
      # annotation تبدیل می‌کنیم تا از طریق APIِ گیت‌هاب هم دیده شوند.
      - name: Report test failures
        if: failure()
        run: |
          {
            grep -E " FAILED$" test.log | head -n 25
            grep -E "^\s+(org\.opentest4j|java\.lang|kotlin\.|expected:|Expected )" test.log | head -n 25
          } | while IFS= read -r line; do echo "::error::${line:0:300}"; done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports/tests/test/**'
          if-no-files-found: ignore

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      # On failure, surface the interesting part of the log as workflow annotations
      # (readable via the API even when the full log download is unavailable).
      - name: Report build failure
        if: failure()
        run: |
          echo "## Build failed — last 100 log lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no build.log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            awk '/^\* Where:/{f=1} f' build.log 2>/dev/null | head -n 6
            grep -E "requires|Dependency '|issues were found" build.log 2>/dev/null | head -n 6
            grep -E "Caused by:" build.log 2>/dev/null | head -n 2
          } | while IFS= read -r line; do echo "::error::${line:0:300}"; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
