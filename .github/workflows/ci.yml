# CI — every JVM test in the repo (`checkAll`) plus the debug APK, so a green PR is installable.
# Want just an APK for a branch? Run the `Debug APK` workflow from the Actions tab.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: checkAll (all JVM tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # `-x lint`: `check` on Android modules also runs lint, which is a separate concern (and slow);
      # here we only want the JVM tests of every module.
      - name: Run every module's tests
        run: |
          set -o pipefail
          ./gradlew checkAll -x lint --stacktrace 2>&1 | tee tests.log

      # The runner's log lives behind a blob URL that API-only environments often cannot fetch, so
      # the interesting lines are also published as annotations and in the job summary.
      - name: Report test results
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          path = "tests.log"
          txt = open(path, errors="replace").read() if os.path.exists(path) else "(no tests.log)"
          lines = txt.splitlines()
          pat = re.compile(
              r"FAILURE:|What went wrong|^e: |error:|Execution failed|Caused by:|tests? completed|BUILD (SUCCESSFUL|FAILED)|> Task .*:test.*FAILED"
          )
          hits = [l for l in lines if pat.search(l)]
          report = (hits or lines)[-10:]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## `checkAll -x lint`\n\n```\n" + "\n".join(report) + "\n```\n")
          for l in report:
              safe = l.replace("%", "%25").replace("\r", "").replace(":", "%3A")[:280]
              print(f"::error file=tests.log,line=1::{safe}")
          PY

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      # On failure, surface the interesting part of the log as workflow annotations
      # (readable via the API even when the full log download is unavailable).
      - name: Report build failure
        if: failure()
        run: |
          echo "## Build failed — last 100 log lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no build.log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            awk '/^\* Where:/{f=1} f' build.log 2>/dev/null | head -n 6
            grep -E "requires|Dependency '|issues were found" build.log 2>/dev/null | head -n 6
            grep -E "Caused by:" build.log 2>/dev/null | head -n 2
          } | while IFS= read -r line; do echo "::error::${line:0:300}"; done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-debug-apk-ci
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
