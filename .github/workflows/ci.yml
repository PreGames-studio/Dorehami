# CI — builds the debug APK and publishes it as a downloadable artifact.
# A `checkAll` job (all JVM tests) joins this workflow once the module skeleton (M0) lands.
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate curated Pantohub word bank
        run: python3 scripts/validate_pantohub_seed.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test logic and build debug APK
        run: |
          set -o pipefail
          ./gradlew :games:pantohub:core:test :app:assembleDebug --stacktrace 2>&1 | tee build.log

      # On failure, surface the interesting part of the log as workflow annotations
      # (readable via the API even when the full log download is unavailable).
      - name: Report build failure
        if: failure()
        run: |
          echo "## Build failed — last 100 log lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no build.log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            awk '/^\* Where:/{f=1} f' build.log 2>/dev/null | head -n 6
            grep -E "requires|Dependency '|issues were found" build.log 2>/dev/null | head -n 6
            grep -E '(^e: |kt:[0-9]+:[0-9]+:|must be exhaustive|FAILED|expected:|but was:|tests completed)' build.log 2>/dev/null | tail -n 40
            grep -E "Caused by:" build.log 2>/dev/null | head -n 2
          } | while IFS= read -r line; do echo "::error::${line:0:300}"; done
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          results = []
          for path in Path("games/pantohub/core/build/test-results/test").glob("TEST-*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      detail = (failure.attrib.get("message", "") + " " + (failure.text or "")).replace("\\n", " ")
                      message = f"FAILED {case.attrib.get('classname', '')}.{case.attrib.get('name', '')}: {detail[:700]}"
                      print(f"::error::{message}")
                      results.append(message)
          if results:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("\\n## JVM test failures\\n\\n" + "\\n".join(f"- {item}" for item in results) + "\\n")
          PY

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-build-log
          path: build.log
          if-no-files-found: warn

      # Public APK: word-bank tools are compiled out. Developer APK: same code with the developer flag on.
      - name: Build developer APK (word-bank tools enabled)
        run: |
          set -o pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/dorehami-debug-public.apk
          ./gradlew :app:assembleDebug -Pdorehami.pantohubDeveloperTools=true --stacktrace 2>&1 | tee build-developer.log
          cp app/build/outputs/apk/debug/app-debug.apk dist/dorehami-debug-developer.apk

      - name: Upload public APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-debug-apk
          path: dist/dorehami-debug-public.apk
          if-no-files-found: error

      - name: Upload developer APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-developer-apk
          path: dist/dorehami-debug-developer.apk
          if-no-files-found: error
