# CI — every module's check tasks (`checkAll`) plus the debug APK, so a green PR is installable.
# Want just an APK for a branch? Run the `Debug APK` workflow from the Actions tab.
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: checkAll (all module checks)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The embedded Godot game must export its PCK before any Android
      # module is configured: :games:dejban:ui fails fast without it.
      - name: Prepare embedded Dezhban Godot pack
        run: bash games/dejban/tools/prepare_android_pack.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Do not exclude lint or any module's tests: `checkAll` is the full repository gate.
      - name: Run every module's checks
        run: |
          set -o pipefail
          ./gradlew checkAll --stacktrace 2>&1 | tee tests.log

      # The runner's log lives behind a blob URL that API-only environments often cannot fetch, so
      # the interesting lines are also published as annotations and in the job summary.
      - name: Report test results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, re, sys
          import xml.etree.ElementTree as ET

          txt = open("tests.log", errors="replace").read() if os.path.exists("tests.log") else ""
          lines = txt.splitlines()
          ok = any("BUILD SUCCESSFUL" in l for l in lines)

          # Totals straight from the JUnit XML each test task wrote.
          per, tot, bad = {}, 0, 0
          test_failures = []
          for f in glob.glob("**/build/test-results/**/*.xml", recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              attrs = lambda k: int(root.get(k) or 0)
              n, fl, sk = attrs("tests"), attrs("failures") + attrs("errors"), attrs("skipped")
              acc = per.setdefault(f.split("/build/")[0], [0, 0, 0])
              acc[0] += n; acc[1] += fl; acc[2] += sk
              tot += n; bad += fl
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      detail = (failure.get("message", "") + " " + (failure.text or "")).replace("\\n", " ")
                      test_failures.append(
                          f"TEST {case.get('classname', '')}.{case.get('name', '')}: {detail[:650]}"
                      )

          # A successful aggregate build must still prove that its critical suites ran.
          expected = {"server", "games/hokm/ui"}
          missing = sorted(module for module in expected if per.get(module, [0, 0, 0])[0] == 0)
          pat = re.compile(r"FAILURE:|What went wrong|^e: |error:|Execution failed|Caused by:|tests? completed|FAILED$|BUILD (SUCCESSFUL|FAILED)")
          hits = [l for l in lines if pat.search(l)]
          report = (hits or lines)[-8:]
          for f in glob.glob("**/build/reports/lint-results-*.xml", recursive=True):
              try:
                  root = ET.parse(f).getroot()
              except Exception:
                  continue
              for issue in root.iter("issue"):
                  if issue.get("severity") in ("Error", "Fatal"):
                      loc = issue.find("location")
                      where = f"{loc.get('file')}:{loc.get('line')}" if loc is not None else f
                      report.append(f"LINT {issue.get('id')} {where}: {issue.get('message', '')}")
          starts = [i for i, l in enumerate(lines) if l.strip() == "* What went wrong:"]
          if starts:
              for l in lines[starts[-1] + 1:]:
                  if l.startswith("* Try:"):
                      break
                  if l.strip():
                      report.append(l.strip())
          report.extend(test_failures)
          report = report[-8:]
          good = ok and tot > 0 and not bad and not missing
          head = (f"checkAll: {tot} tests, {bad} failing, {len(per)} module(s) with results"
                  if tot else "checkAll: no test results were written")
          if missing:
              head += "; missing expected results: " + ", ".join(missing)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## " + ("✅ " if good else "❌ ") + head + "\n\n")
              if per:
                  f.write("| module | tests | failures | skipped |\n|---|---:|---:|---:|\n")
                  for mod in sorted(per):
                      n, fl, sk = per[mod]
                      f.write(f"| `{mod}` | {n} | {fl} | {sk} |\n")
              f.write("\n```\n" + "\n".join(report) + "\n```\n")
          level = "notice" if good else "error"
          print(f"::{level} file=tests.log,line=1::{head}")
          if not good:
              for l in report:
                  safe = l.replace("%", "%25").replace("\r", "")[:280]
                  print(f"::error file=tests.log,line=1::{safe}")
              sys.exit(1)
          PY

  build-apk:
    name: Build debug APK
    # An explicit diagnostic-only branch push inspects an existing APK and must
    # not manufacture a new one. PRs and main retain the normal APK gate.
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/') && contains(github.event.head_commit.message, '[diagnose-apk]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used by the arena/* preview-release step below
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate curated Pantohub word bank
        run: python3 scripts/validate_pantohub_seed.py

      - name: Prepare embedded Dezhban Godot pack
        run: bash games/dejban/tools/prepare_android_pack.sh

      # Without a cached key every run minted a brand-new debug signing key, so a
      # freshly downloaded APK refused to update an older install ("app not
      # installed" / signature mismatch). Keep one key for all builds of a branch
      # lineage so updates install cleanly.
      - name: Reuse one debug signing key across builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dorehami-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test logic and build debug APK
        run: |
          set -o pipefail
          ./gradlew :games:pantohub:core:test :app:assembleDebug --stacktrace 2>&1 | tee build.log

      # On failure, surface the interesting part of the log as workflow annotations
      # (readable via the API even when the full log download is unavailable).
      - name: Report build failure
        if: failure()
        run: |
          echo "## Build failed — last 100 log lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no build.log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          log = Path("build.log")
          if log.exists():
              rows = log.read_text(errors="replace").splitlines()
              # Print the exact Gradle failure block (annotations are capped per step, so stay terse).
              starts = [i for i, line in enumerate(rows) if line.strip() == "* What went wrong:"]
              block = []
              if starts:
                  for line in rows[starts[-1] + 1:]:
                      if line.startswith("* Try:"):
                          break
                      if line.strip():
                          block.append(line.strip())
              for line in block[:9]:
                  safe = line[:280].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error file=build.log,line=1::{safe}")
          PY
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          results = []
          for path in Path("games/pantohub/core/build/test-results/test").glob("TEST-*.xml"):
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  if failure is None:
                      failure = case.find("error")
                  if failure is not None:
                      detail = (failure.attrib.get("message", "") + " " + (failure.text or "")).replace("\\n", " ")
                      message = f"FAILED {case.attrib.get('classname', '')}.{case.attrib.get('name', '')}: {detail[:700]}"
                      print(f"::error::{message}")
                      results.append(message)
          if results:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("\\n## JVM test failures\\n\\n" + "\\n".join(f"- {item}" for item in results) + "\\n")
          PY

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

      # Guard against a silently pack-less APK: the embedded game must be inside.
      - name: Verify Dezhban pack is inside the APK
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          unzip -l "$apk" | grep -E "assets/dezhban\.pck" || { echo "::error::dezhban.pck missing from APK"; exit 1; }
          unzip -l "$apk" | grep -E "lib/[^ ]+/libgodot_android\.so" || { echo "::error::Godot native library missing from APK"; exit 1; }
          {
            echo "## Dezhban embedded ✅"
            echo '```'
            unzip -l "$apk" | grep -E "assets/dezhban\.pck|lib/[^ ]+/libgodot_android\.so"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Installability gate: nothing is published unless the file a phone receives
      # is complete, correctly signed and free of the defects that produce
      # «بسته نامعتبر است» / "There was a problem parsing the package".
      - name: Verify the shipped APK (installability gate)
        run: |
          set -uo pipefail
          fail=0
          note() {  # surface the reason as an annotation; logs behind blob URLs are often unreadable
            printf '::error title=%s::%s\n' "$1" "$(printf '%s' "${2:-failed}" | head -c 900 | tr '\n' ' ')"
            fail=1
          }
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools=$(find "${sdk:-/nonexistent}/build-tools" -maxdepth 1 -mindepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          [ -n "${tools:-}" ] || note build-tools "no build-tools directory under '${sdk:-<ANDROID_HOME unset>}'"
          echo "build-tools: ${tools:-none}"

          self_out=$(python3 scripts/verify_shipped_apk.py --self-test 2>&1) || note self-test "$self_out"
          echo "$self_out"

          if [ -n "${tools:-}" ]; then
            # 4-byte ZIP alignment: an unaligned archive is rejected by some installers.
            zip_out=$("$tools/zipalign" -c -v 4 "$apk" 2>&1) || note zipalign "$(printf '%s\n' "$zip_out" | tail -n 5)"
            # The signature must validate for every minimum SDK the app still claims.
            for api in 24 26 28 30 33 34 35; do
              sig_out=$("$tools/apksigner" verify --min-sdk-version "$api" "$apk" 2>&1) \
                || note "apksigner-api$api" "$sig_out"
            done
            aapt_path=""
            [ -x "$tools/aapt2" ] && aapt_path="$tools/aapt2"
            [ -z "$aapt_path" ] && [ -x "$tools/aapt" ] && aapt_path="$tools/aapt"
            verify_out=$(python3 scripts/verify_shipped_apk.py "$apk" ${aapt_path:+--aapt "$aapt_path"} --min-sdk 24 2>&1) \
              || note "apk-checks" "$(printf '%s\n' "$verify_out" | grep -E '^\[FAIL\]|verification failed' | head -n 6)"
          else
            verify_out=$(python3 scripts/verify_shipped_apk.py "$apk" --min-sdk 24 2>&1) \
              || note "apk-checks" "$(printf '%s\n' "$verify_out" | grep -E '^\[FAIL\]|verification failed' | head -n 6)"
          fi
          printf '%s\n' "$verify_out"
          echo "APK_SHA256=$(printf '%s\n' "$verify_out" | awk '/^sha256:/{print $2; exit}')" >> "$GITHUB_ENV"
          echo "APK_BYTES=$(stat -c%s "$apk")" >> "$GITHUB_ENV"
          {
            echo "## $( [ "$fail" -eq 0 ] && echo '✅' || echo '❌' ) APK installability checks"
            echo '```'
            printf '%s\n' "$verify_out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$fail"

      # Branch previews: on arena/* branches the verified APK is also published to a
      # per-branch prerelease, so it has a plain direct download URL. main is untouched.
      - name: Publish branch APK preview release
        if: startsWith(github.ref, 'refs/heads/arena/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          sha=$(git rev-parse --short=7 HEAD)
          tag="preview-${branch}"
          cp "$apk" "Dorehami-debug.apk"
          cp "$apk" "Dorehami-debug-${branch}-${sha}.apk"
          # A checksum file next to the APK lets anyone prove the download is intact.
          printf '%s  Dorehami-debug.apk\n' "${APK_SHA256}" > Dorehami-debug.apk.sha256
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${tag}/Dorehami-debug.apk"
          mb=$((APK_BYTES / 1024 / 1024))
          {
            echo "### دورهمی — بیلد دیباگ \`${GITHUB_REF_NAME}\`"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| کامیت | \`${GITHUB_SHA}\` |"
            echo "| حجم | ${mb} مگابایت (${APK_BYTES} بایت) |"
            echo "| SHA-256 | \`${APK_SHA256}\` |"
            echo
            echo "**دانلود مستقیم:** ${url}"
            echo
            echo "**قبل از نصب سالم‌بودن فایل را چک کن** — دانلود ناقص شایع‌ترین دلیل خطای «بستهٔ نامعتبر» است:"
            echo
            echo '```'
            echo "sha256sum Dorehami-debug.apk                   # لینوکس/مک"
            echo "certutil -hashfile Dorehami-debug.apk SHA256   # ویندوز"
            echo '```'
            echo
            echo "مقدار باید دقیقاً همان SHA-256 جدول بالا باشد؛ فایل \`Dorehami-debug.apk.sha256\` هم کنار APK منتشر شده است."
            echo
            echo "**نصب:** فایل را روی گوشی باز کن و «نصب» را بزن، یا \`adb install -r -t Dorehami-debug.apk\`."
            echo "این بیلد با کلید دیباگ امضا شده است؛ اگر نسخهٔ قبلی دورهمی از زنجیرهٔ بیلد دیگری روی گوشی است،"
            echo "اول آن را حذف کن وگرنه اندروید «برنامه نصب نشد» (اختلاف امضا) نشان می‌دهد."
            echo
            echo "این فایل پیش از انتشار خودکار اعتبارسنجی شده است: CRC همهٔ ورودی‌ها، امضای v1 و APK Signing Block،"
            echo "تراز ۴ بایتی (zipalign)، حضور \`assets/dezhban.pck\` و \`lib/arm64-v8a/libgodot_android.so\`،"
            echo "و شناسه و بازهٔ SDK از طریق \`aapt2\`."
          } > release-notes.md
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --prerelease --title "Preview: ${GITHUB_REF_NAME}" --target "${GITHUB_SHA}" --notes-file release-notes.md
          gh release upload "$tag" "Dorehami-debug.apk" "Dorehami-debug-${branch}-${sha}.apk" "Dorehami-debug.apk.sha256" --clobber
          gh release edit "$tag" --notes-file release-notes.md --target "${GITHUB_SHA}" >/dev/null 2>&1 || true
          echo "published: ${url}"
