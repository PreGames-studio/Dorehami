# CI — builds the debug APK and publishes it as a downloadable artifact.
# A `checkAll` job (all JVM tests) joins this workflow once the module skeleton (M0) lands.
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      # On failure, surface the interesting part of the log as workflow annotations
      # (readable via the API even when the full log download is unavailable).
      - name: Report build failure
        if: failure()
        run: |
          echo "## Build failed — last 100 log lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 100 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no build.log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          {
            awk '/^\* Where:/{f=1} f' build.log 2>/dev/null | head -n 6
            grep -E "requires|Dependency '|issues were found" build.log 2>/dev/null | head -n 6
            grep -E '(^e: |kt:[0-9]+:[0-9]+:|must be exhaustive)' build.log 2>/dev/null | tail -n 30
            grep -E "Caused by:" build.log 2>/dev/null | head -n 2
          } | while IFS= read -r line; do echo "::error::${line:0:300}"; done

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
