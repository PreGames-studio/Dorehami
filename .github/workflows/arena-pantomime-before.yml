# TEMPORARY — runs the Pantomime emulator check against the PRE-FIX commit 6c09ff4 (old game
# code + the same test) to show the test really catches PH-B01. Removed again right after it ran.
name: Pantomime device check (before fix, temporary)

on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/arena-pantomime-before.yml"

permissions:
  contents: read
  checks: write

jobs:
  pantomime-before-fix:
    name: Pantomime play modes on an emulator (pre-fix code)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout the pre-fix commit
        uses: actions/checkout@v4
        with:
          ref: 6c09ff446bfc444dee4d3c76b0050fc14ffcdc43

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and play Pantomime on the emulator
        id: device
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -no-boot-anim -no-audio -camera-back none
            -gpu swiftshader_indirect
          # Plain `sh` runs this block: no pipefail, so capture the exit code explicitly.
          script: |
            python3 tools/device-check/pantomime_play_modes.py app/build/outputs/apk/debug/app-debug.apk > device-log.txt 2>&1
            rc=$?
            cat device-log.txt
            echo "device-check exit code: $rc"
            exit $rc

      - name: Surface the device log as annotations
        if: always()
        run: |
          echo "::notice::emulator step outcome: ${{ steps.device.outcome }}"
          python3 tools/device-check/report_annotations.py device-log.txt || true

      - name: Publish the device log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/device-check/publish_report.py device-log.txt "${{ github.sha }}" "Device log (pantomime play modes, BEFORE fix)"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pantomime-device-screenshots-before-fix
          path: device-shots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Report
        if: always()
        run: |
          if [ "${{ steps.device.outcome }}" = "success" ]; then
            echo "## 📱 Pantomime on a device ✅" >> "$GITHUB_STEP_SUMMARY"
            echo "حالت عادی با حدس درست نوبت را تمام کرد؛ رد واژه نوبت را نگه داشت؛ حالت سرعتی ادامه داد." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 📱 Pantomime on a device ❌" >> "$GITHUB_STEP_SUMMARY"
            echo "یکی از انتظارها روی امولاتور برقرار نبود — جزئیات در «Device log (pantomime play modes)»." >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "${{ steps.device.outcome }}" = "success" ]
