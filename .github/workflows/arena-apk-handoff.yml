# TEMPORARY Arena-session helper — deleted again right after use.
#
# The sandbox that reviews this repo can reach api.github.com but not the blob storage behind
# workflow artifacts, so `gh run download` fails there. This job copies the debug APK built by the
# `Debug APK` run 38741412714 (main @ 9a4a2d2) into *unreferenced* git blobs that can be fetched via
# the REST API. No branch, tag or release is created or modified.
name: APK handoff (temporary)

on:
  push:
    branches: ["arena/852e62eb-dorehami"]
    paths: [".github/workflows/arena-apk-handoff.yml"]

permissions:
  contents: write # POST /git/blobs only
  actions: read # download another run's artifact

jobs:
  handoff:
    name: Hand the main debug APK over
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download the main debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: dorehami-debug-apk
          run-id: 38741412714
          github-token: ${{ github.token }}
          path: apk

      - name: Verify the APK with the runner's Android SDK
        run: |
          set -uo pipefail
          ls -la apk
          f=apk/Dorehami-debug.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          badging=$("$bt/aapt2" dump badging "$f" 2>&1 \
            | grep -E "^(package|sdkVersion|targetSdkVersion|application-label:|launchable-activity|uses-permission|native-code)" \
            | paste -sd'|' -)
          echo "::notice title=aapt2 badging::${badging:0:3800}"
          certs=$("$bt/apksigner" verify --verbose --print-certs "$f" 2>&1 | grep -v "^WARNING" | paste -sd'|' -)
          echo "::notice title=apksigner::${certs:0:3800}"
          echo "::notice title=build-tools::$(basename "$bt")"

      - name: Store the APK as unreferenced git blobs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          f=apk/Dorehami-debug.apk
          size=$(stat -c%s "$f")
          sum=$(sha256sum "$f" | cut -d' ' -f1)
          split -b 8000000 -d -a 2 "$f" part-
          parts=""
          for p in part-*; do
            python3 -c 'import base64, json, sys; d = open(sys.argv[1], "rb").read(); json.dump({"content": base64.b64encode(d).decode(), "encoding": "base64"}, open("body.json", "w"))' "$p"
            sha=$(gh api "repos/$REPO/git/blobs" --input body.json --jq .sha)
            parts="$parts $p=$sha"
          done
          echo "::notice title=apk-handoff::size=$size sha256=$sum parts=$parts"

      # Read-only probe: the `Publish rolling debug release` job runs `gh release ...` without a
      # checkout. Show what gh says there, with and without an explicit repository.
      - name: Probe the debug-latest publish step (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          git rev-parse --is-inside-work-tree >/dev/null 2>&1 && echo "inside a git repo" || echo "no git repo here (same as the publish job)"
          out=$(gh release list 2>&1) && rc=0 || rc=$?
          echo "::notice title=gh release list (no GH_REPO)::rc=$rc $(printf '%s' "$out" | paste -sd'|' - | cut -c1-600)"
          out=$(GH_REPO="${{ github.repository }}" gh release list 2>&1) && rc=0 || rc=$?
          echo "::notice title=gh release list (GH_REPO set)::rc=$rc $(printf '%s' "$out" | paste -sd'|' - | cut -c1-600)"
