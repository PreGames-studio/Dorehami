# Debug APK — a build you can actually install on a phone and test.
#
# * Run it for any branch from the Actions tab (the branch dropdown lists every branch that has this
#   file) — the APK lands in the run's artifacts, no merge needed.
# * Every push to `main` refreshes a rolling `debug-latest` GitHub release so the download URL is
#   stable:  https://github.com/<org>/<repo>/releases/download/debug-latest/Dorehami-debug.apk
#
# Artifact upload only needs the default read-only workflow token. Publishing to the release needs
# Settings → Actions → General → Workflow permissions = "Read and write"; without it the publish
# step logs a warning and the run still succeeds.
name: Debug APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "هم‌زمان روی ریلیز debug-latest هم منتشر شود"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare embedded Dezhban Godot pack
        run: bash games/dejban/tools/prepare_android_pack.sh

      # Same stable debug signing key used by the branch preview builds.
      - name: Reuse debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dorehami-debug-keystore-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      # Do not publish a corrupt, unsigned, misaligned or single-ABI file.
      - name: Verify APK installability
        run: |
          set -euo pipefail
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          python3 scripts/verify_shipped_apk.py --self-test
          python3 scripts/verify_shipped_apk.py "$apk" --aapt "$tools/aapt2" --min-sdk 24 \
            --require-abi arm64-v8a --require-abi armeabi-v7a
          "$tools/zipalign" -c -v 4 "$apk" > /dev/null
          for api in 24 26 28 30 33 34 35; do
            "$tools/apksigner" verify --min-sdk-version "$api" "$apk"
          done

      - name: Package and describe the APK
        run: |
          set -euo pipefail
          mkdir -p dist
          src=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          sha=$(git rev-parse --short=7 HEAD)
          ref_name=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          cp "$src" dist/Dorehami-debug.apk
          cp "$src" "dist/Dorehami-debug-${ref_name}-${sha}.apk"
          (cd dist && sha256sum Dorehami-debug.apk > Dorehami-debug.apk.sha256)
          size=$(du -h dist/Dorehami-debug.apk | cut -f1)
          sum=$(sha256sum dist/Dorehami-debug.apk | cut -c1-16)
          aapt2=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1 || true)
          {
            echo "## Debug APK ✅"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| برنچ/تگ | \`${GITHUB_REF_NAME}\` |"
            echo "| کامیت | \`${sha}\` |"
            echo "| اندازه | ${size} |"
            echo "| sha256 | \`${sum}…\` |"
            if [ -n "${aapt2:-}" ] && [ -x "$aapt2/aapt2" ]; then
              badging=$("$aapt2/aapt2" dump badging dist/Dorehami-debug.apk 2>/dev/null | head -n 3 | tr '\n' ' ' || true)
              echo "| پکیج/SDK | \`${badging:0:220}\` |"
            fi
            echo
            echo "**نصب:** فایل را از بخش Artifacts همین اجرا دانلود کن، بعد"
            echo
            echo '```bash'
            echo "adb install -r -t Dorehami-debug.apk     # یا روی گوشی مستقیم باز کن (debug signing)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dorehami-debug-apk
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

      # Guard against a silently pack-less APK: the embedded game must be inside.
      - name: Verify Dezhban pack is inside the APK
        run: |
          apk=dist/Dorehami-debug.apk
          echo "APK: $apk ($(du -h "$apk" | cut -f1))"
          unzip -l "$apk" | grep -E "assets/dezhban\.pck" || { echo "::error::dezhban.pck missing from APK"; exit 1; }
          unzip -l "$apk" | grep -E "lib/[^ ]+/libgodot_android\.so" || { echo "::error::Godot native library missing from APK"; exit 1; }
          {
            echo "## Dezhban embedded ✅"
            echo '```'
            unzip -l "$apk" | grep -E "assets/dezhban\.pck|lib/[^ ]+/libgodot_android\.so"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report build failure
        if: failure()
        run: |
          echo "## Debug APK build failed — last 80 log lines" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(no build.log)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY'
          from pathlib import Path
          log = Path("build.log")
          if log.exists():
              rows = log.read_text(errors="replace").splitlines()
              starts = [i for i, line in enumerate(rows) if line.strip() == "* What went wrong:"]
              block = []
              if starts:
                  for line in rows[starts[-1] + 1:]:
                      if line.startswith("* Try:"):
                          break
                      if line.strip():
                          block.append(line.strip())
              for line in block[:9]:
                  safe = line[:280].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error file=build.log,line=1::{safe}")
          PY

  publish-release:
    name: Publish rolling debug release
    needs: debug-apk
    if: github.event_name == 'push' || inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dorehami-debug-apk
          path: apk

      # This job downloads artifacts without checking out the repository, so
      # gh needs an explicit repository. A failed upload must fail the workflow.
      - name: Upload to debug-latest release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk=apk/Dorehami-debug.apk
          notes="بیلد دیباگ جاری برای تست روی گوشی. نصب: \`adb install -r -t Dorehami-debug.apk\`
          اجرا: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh release view debug-latest >/dev/null 2>&1 || \
            gh release create debug-latest --prerelease --title "Debug APK (rolling)" --target "${GITHUB_SHA}" --notes "$notes"
          gh release upload debug-latest "$apk" apk/Dorehami-debug.apk.sha256 "apk/Dorehami-debug-main-${GITHUB_SHA:0:7}.apk" --clobber
          gh release edit debug-latest --target "$GITHUB_SHA" --notes "$notes"
          echo "published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/debug-latest/Dorehami-debug.apk"
