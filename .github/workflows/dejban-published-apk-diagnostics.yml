# Diagnose the exact already-published APK, without exporting or releasing a new APK.
name: Dezhban published APK diagnostics

on:
  push:
    branches: ["arena/**"]
    paths:
      - ".github/workflows/dejban-published-apk-diagnostics.yml"
      - "games/dejban/tools/diagnose_published_apk_on_emulator.sh"
      - "games/dejban/tools/download_published_apks_for_diagnosis.sh"

permissions:
  contents: read

# Pin both digests to the actual releases being investigated. A changed latest
# release must not silently replace the APK under test.
env:
  CURRENT_APK_SHA256: a29a5349b8d18f5d539c9b2b3c8afd0cfc713b187451f6ef0038b1f5bfa3a01d
  PREVIOUS_APK_SHA256: f2a4ca68ff21fbb9a5aee334b7c2d7e8b18396cc7ce76ae01fc52b0c9dbfc3c1

jobs:
  inspect:
    name: Inspect the published packages
    if: ${{ contains(github.event.head_commit.message, '[diagnose-apk]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify the exact existing APKs
        run: bash games/dejban/tools/download_published_apks_for_diagnosis.sh apk
      - name: Inspect signing, package data and native libraries
        run: |
          set -euo pipefail
          tools=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -printf '%h\n' | sort -V | tail -1)
          test -x "$tools/apksigner"
          test -x "$tools/aapt"
          test -x "$tools/zipalign"
          for which in previous current; do
            apk="apk/$which.apk"
            unzip -tq "$apk"
            "$tools/apksigner" verify --verbose --print-certs "$apk" > "$which-signature.txt"
            while IFS= read -r line; do
              case "$line" in
                'Verified using '*|'Signer #1 certificate SHA-256 digest:'*)
                  echo "::notice title=dezhban-${which}-signature::$line" ;;
              esac
            done < "$which-signature.txt"
            details=$("$tools/aapt" dump badging "$apk" | \
              grep -E '^package:|^sdkVersion:|^targetSdkVersion:|^native-code:' | tr '\n' ' ')
            echo "::notice title=dezhban-${which}-manifest::$details"
          done
          old=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' previous-signature.txt)
          new=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' current-signature.txt)
          test -n "$old" && test -n "$new"
          if [ "$old" = "$new" ]; then matching=yes; else matching=no; fi
          echo "::notice title=dezhban-upgrade-signature::Previous and current signing certificates match: $matching"
          echo '::group::64-bit native ELF program headers'
          found=0
          while IFS= read -r library; do
            found=$((found + 1))
            binary="$RUNNER_TEMP/$(echo "$library" | tr / _)"
            unzip -p apk/current.apk "$library" > "$binary"
            test -s "$binary"
            header=$(readelf -hW "$binary" | grep -E 'Class:|Machine:' | tr '\n' ' ')
            alignments=$(readelf -lW "$binary" | awk '$1 == "LOAD" { print $NF }' | sort -u | paste -sd, -)
            test -n "$alignments"
            echo "::notice title=dezhban-native-alignment::$library $header LOAD=$alignments"
          done < <(unzip -Z1 apk/current.apk | grep -E '^lib/(arm64-v8a|x86_64)/.*\.so$')
          test "$found" -ge 2
          echo '::endgroup::'
          if "$tools/zipalign" -c -P 16 -v 4 apk/current.apk > zipalign-16k.txt 2>&1; then
            echo '::notice title=dezhban-zip-alignment::APK ZIP alignment check for 16 KiB passed.'
          else
            detail=$(tail -3 zipalign-16k.txt | tr '\n' ' ' | cut -c1-500)
            echo "::notice title=dezhban-zip-alignment::APK ZIP alignment check for 16 KiB failed: $detail"
          fi

  install:
    name: Install and update on API ${{ matrix.api }} (${{ matrix.target }})
    if: ${{ contains(github.event.head_commit.message, '[diagnose-apk]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: default
            expected_page_size: ''
          - api: 29
            target: default
            expected_page_size: ''
          - api: 35
            target: google_apis
            expected_page_size: '4096'
          - api: 35
            target: google_apis_ps16k
            expected_page_size: '16384'
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the exact existing APKs
        run: bash games/dejban/tools/download_published_apks_for_diagnosis.sh apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check old, update and fresh install
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          force-avd-creation: false
          disable-animations: true
          emulator-options: >-
            -no-snapshot -no-window -no-boot-anim -no-audio -camera-back none
            -gpu swiftshader_indirect
          script: bash games/dejban/tools/diagnose_published_apk_on_emulator.sh apk/previous.apk apk/current.apk '${{ matrix.expected_page_size }}' > install-diagnostics.log 2>&1
      - name: Surface precise installer diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          log = Path('install-diagnostics.log')
          if not log.exists():
              print('::warning title=dezhban-install-diagnosis::Emulator test did not produce a log.')
          else:
              for line in log.read_text(errors='replace').splitlines()[-70:]:
                  safe = line[:800].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title=dezhban-install-diagnosis::{safe}')
          PY
